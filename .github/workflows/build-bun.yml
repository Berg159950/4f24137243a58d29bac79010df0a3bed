name: build-bun-penryn

on:
  workflow_dispatch:
    inputs:
      bun_commit:
        description: Bun commit to build (empty = latest stable release)
        required: false
        default: ""
  schedule:
    - cron: '0 3 * * *'  # каждый день в 03:00 UTC проверяем новые релизы Bun
  release:
    types: [published]

env:
  BUN_COMMIT: ${{ github.event.inputs.bun_commit }}
  OPENCODE_REPO: Berg159950/f306f005c6bdc9490087007466ccf56f
  KILOCODE_REPO: Berg159950/e4b61f8a16717366a1baea5ad4aa2f5c

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      skip: ${{ steps.set-skip.outputs.skip }}
    steps:
      - name: Resolve Bun tag
        id: tag
        run: |
          if [ -n "$BUN_COMMIT" ]; then
            TAG="$BUN_COMMIT"
          else
            TAG=$(curl -fsSL https://api.github.com/repos/oven-sh/bun/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)
          fi
          [ -n "$TAG" ] || { echo "Failed to resolve Bun tag"; exit 1; }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "Using Bun tag: $TAG"

      - name: Check if already built (schedule only)
        id: check
        if: github.event_name == 'schedule'
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          EXISTING=$(gh api repos/${{ github.repository }}/releases --jq ".[] | select(.tag_name == \"bun-penryn-$VERSION-\") | .tag_name" | head -1)
          if [ -n "$EXISTING" ]; then
            echo "Version $VERSION already built ($EXISTING), skipping"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New version $VERSION, will build"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set skip output
        id: set-skip
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # skip already set by check step
            echo "skip=${{ steps.check.outputs.skip }}" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    outputs:
      bun_version: ${{ needs.check-version.outputs.version }}
      bun_sha256: ${{ steps.sha256.outputs.sha256 }}
      release_url: ${{ steps.release.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache cmake ninja-build patchelf
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-21 lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-21 /usr/local/bin/lld
          sudo ln -sf /usr/bin/llvm-ar-21 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-ranlib-21 /usr/local/bin/llvm-ranlib
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: bun-penryn-${{ needs.check-version.outputs.version }}

      - name: Setup Bun (for build script)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Clone Bun
        run: |
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/oven-sh/bun.git /tmp/bun-src && break
            [ $i -lt 3 ] && sleep 10
          done
          [ -d /tmp/bun-src/.git ] || exit 1
          cd /tmp/bun-src
          for i in 1 2 3; do
            git fetch --depth 1 origin ${{ needs.check-version.outputs.tag }} && break
            [ $i -lt 3 ] && sleep 10
          done
          git checkout FETCH_HEAD

      - name: Resolve WebKit version from Bun source
        id: webkit
        run: |
          cd /tmp/bun-src
          WEBKIT_VER=""
          for f in scripts/build/deps/webkit.ts scripts/build/deps/webkit.js vendor/webkit-version.txt .github/workflows/*.yml; do
            if [ -f "$f" ]; then
              WEBKIT_VER=$(grep -oE '[0-9a-f]{40}' "$f" | head -1)
              [ -n "$WEBKIT_VER" ] && break
            fi
          done
          if [ -z "$WEBKIT_VER" ]; then
            WEBKIT_VER=$(grep -r "oven-sh/WebKit" --include="*.ts" --include="*.js" --include="*.json" . 2>/dev/null | grep -oE '[0-9a-f]{40}' | head -1)
          fi
          [ -z "$WEBKIT_VER" ] && WEBKIT_VER="549170099226f816a4b204ea1d8fa102fb79eefa"
          echo "version=$WEBKIT_VER" >> $GITHUB_OUTPUT
          echo "Resolved WebKit version: $WEBKIT_VER"

      - name: Apply Penryn patch
        run: |
          cd /tmp/bun-src
          sed -i 's/-march=nehalem/-march=penryn/g' scripts/build/flags.ts
          sed -i 's/flag: "-march=penryn"/flag: ["-march=penryn", "-mtune=penryn", "-mno-sse4.2", "-mno-popcnt", "-DHWY_DISABLED_TARGETS=3032"]/' scripts/build/flags.ts
          sed -i 's|no SSE4.2/AVX, broadest compatibility|tuned for Penryn, no SSE4.2/POPCNT/AVX (Highway: SSE2/SSSE3 only)|' scripts/build/flags.ts
          sed -i 's/-Ctarget-cpu=nehalem/-Ctarget-cpu=penryn/g' scripts/build/rust.ts
          sed -i 's/"nehalem"/"penryn"/g' scripts/build/rust.ts
          sed -i 's/Nehalem/Penryn/g' scripts/verify-baseline.ts
          sed -i 's/NEHALEM_ALLOWED/PENRYN_ALLOWED/g' scripts/verify-baseline-static/src/main.rs
          sed -i 's/nehalem/penryn/g' scripts/verify-baseline-static/src/main.rs
          find . -name "CMakeLists.txt" -exec sed -i 's/-march=nehalem/-march=penryn/g' {} +
          find . -name "CMakeLists.txt" -exec sed -i 's/target-cpu=nehalem/target-cpu=penryn/g' {} +
          bun -e "const fs=require('fs');let l=fs.readFileSync('scripts/build/deps/zlib.ts','utf8').split('\n');l.splice(78,22);fs.writeFileSync('scripts/build/deps/zlib.ts',l.join('\n'))"
          sed -i 's/"_avx2.c", "-mavx2"/"_avx2.c", "-msse4.1"/' scripts/build/deps/libwebp.ts
          grep -rn --include="CMakeLists.txt" --include="*.ts" --include="*.rs" --exclude-dir=test --exclude-dir=.git "march=nehalem\|target-cpu=nehalem" . | grep -v "\.test\.ts:" | grep -v "// " && { echo "ERROR: Nehalem still present!"; exit 1; } || echo "All Nehalem references patched successfully"

      - name: Clone WebKit (required for --webkit=local)
        run: |
          mkdir -p /tmp/bun-src/vendor
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/oven-sh/WebKit.git /tmp/bun-src/vendor/WebKit && break
            [ $i -lt 3 ] && sleep 10
          done
          [ -d /tmp/bun-src/vendor/WebKit/.git ] || exit 1
          cd /tmp/bun-src/vendor/WebKit
          for i in 1 2 3; do
            git fetch --depth 1 origin ${{ steps.webkit.outputs.version }} && break
            [ $i -lt 3 ] && sleep 10
          done
          git checkout FETCH_HEAD

      - name: Patch WebKit simdutf
        run: |
          WD="vendor/WebKit/Source/WTF/wtf/simdutf"
          [ -d "$WD" ] || WD="vendor/WebKit/Source/ThirdParty/simdutf"
          [ -d "$WD" ] || WD="src/simdutf_sys"
          echo "simdutf dir: $WD"
          for f in $(grep -rl "SIMDUTF_TARGET_WESTMERE" "$WD" 2>/dev/null); do
            perl -0pi -e 's/#define SIMDUTF_IMPLEMENTATION_ICELAKE[^\n]*\\\n\s*\(\(SIMDUTF_IS_X86_64\) && \(SIMDUTF_COMPILER_SUPPORTS_VBMI2\)\)/#define SIMDUTF_IMPLEMENTATION_ICELAKE 0/' "$f"
            sed -i 's/#define SIMDUTF_IMPLEMENTATION_HASWELL (SIMDUTF_IS_X86_64)/#define SIMDUTF_IMPLEMENTATION_HASWELL 0/' "$f"
            sed -i 's/#define SIMDUTF_TARGET_WESTMERE SIMDUTF_TARGET_REGION("sse4.2,popcnt")/#define SIMDUTF_TARGET_WESTMERE SIMDUTF_TARGET_REGION("sse4.1")/' "$f"
            sed -i 's/\b_popcnt64\b/__builtin_popcountll/g; s/\b__popcnt64\b/__builtin_popcountll/g; s/\b_popcnt32\b/__builtin_popcount/g; s/\b__popcnt\b/__builtin_popcount/g; s/\b_mm_popcnt_u64\b/__builtin_popcountll/g; s/\b_mm_popcnt_u32\b/__builtin_popcount/g' "$f"
            echo "simdutf patched: $f"
          done
          grep -rn "SIMDUTF_IMPLEMENTATION_HASWELL 1\|SIMDUTF_IMPLEMENTATION_ICELAKE 1" "$WD" 2>/dev/null && { echo "ERROR: haswell/icelake still enabled!"; exit 1; } || echo "simdutf: haswell/icelake disabled OK"
          grep -rn "_popcnt64\|_popcnt32\|__popcnt64\|__popcnt\b\|_mm_popcnt_u64\|_mm_popcnt_u32" "$WD" 2>/dev/null && { echo "ERROR: POPCNT intrinsics still present in simdutf!"; exit 1; } || echo "simdutf: POPCNT intrinsics removed OK"

      - name: Build Bun (with local WebKit)
        run: |
          cd /tmp/bun-src
          bun run build:release --webkit=local 2>&1

      - name: QEMU Penryn verify
        run: |
          sudo apt-get install -y -qq qemu-user
          if [ -f /tmp/bun-src/build/release/bun ]; then
            qemu-x86_64 -cpu Penryn /tmp/bun-src/build/release/bun --version
          fi

      - name: Static ISA verify (no POPCNT/AVX/AVX-512)
        run: |
          BUN_BIN="/tmp/bun-src/build/release/bun"
          [ -f "$BUN_BIN" ] || BUN_BIN="/tmp/bun-src/dist/bun/bun"
          objdump -d "$BUN_BIN" > /tmp/disasm.txt 2>/dev/null
          echo "=== Instruction counts ==="
          for pat in "popcnt" "vpopcntq\|vpopcntd" "vaes" "vzeroupper" "vpbroadcast" "vpxor" "vmovdqa\|vmovdqu" "vpmov" "vpshuf\|vperm" "vpadd" "vpand\|vpor" "vpsll\|vpsrl\|vpsra" "vpblend" "vpgather"; do
            echo "$pat: $(grep -c "\b$pat" /tmp/disasm.txt)"
          done
          echo "=== POPCNT check (must be 0) ==="
          if grep -qE '\bpopcnt\b' /tmp/disasm.txt; then
            echo "ERROR: POPCNT instructions still present in binary!"
            grep -nE '\bpopcnt\b' /tmp/disasm.txt | head -20
            exit 1
          fi
          echo "OK: zero POPCNT instructions"
          echo "=== VPOPCNT (AVX-512) check (must be 0) ==="
          if grep -qE '\bvpopcntq\b|\bvpopcntd\b' /tmp/disasm.txt; then
            echo "ERROR: AVX-512 VPOPCNT instructions still present in binary!"
            grep -nE '\bvpopcntq\b|\bvpopcntd\b' /tmp/disasm.txt | head -20
            exit 1
          fi
          echo "OK: zero AVX-512 VPOPCNT instructions"
          echo "=== VAES check (informational: BoringSSL asm, CPUID-gated) ==="
          echo "vaes: $(grep -c '\bvaes' /tmp/disasm.txt)"

      - name: Bundle libs
        run: |
          BUN_BIN="/tmp/bun-src/build/release/bun"
          [ -f "$BUN_BIN" ] || BUN_BIN="/tmp/bun-src/dist/bun/bun"
          mkdir -p /tmp/bundle/lib
          cp "$BUN_BIN" /tmp/bundle/bun.bin
          ldd /tmp/bundle/bun.bin 2>/dev/null | grep "=> /" | awk '{print $3}' | while read lib; do
            cp -n "$lib" /tmp/bundle/lib/ 2>/dev/null || true
          done
          rm -f /tmp/bundle/lib/libc.so.6 /tmp/bundle/lib/libm.so.6 2>/dev/null || true
          cat > /tmp/bundle/bun << 'WRAPPER'
          #!/bin/bash
          DIR="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$DIR/bun.bin" "$@"
          WRAPPER
          chmod +x /tmp/bundle/bun /tmp/bundle/bun.bin

      - name: Smoke test
        run: |
          LD_LIBRARY_PATH= /tmp/bundle/bun --version

      - name: Package artifact
        run: |
          tar czf /tmp/bun-penryn-linux-x64.tar.gz -C /tmp/bundle .

      - name: Compute SHA256
        id: sha256
        run: |
          SHA=$(sha256sum /tmp/bun-penryn-linux-x64.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bun-penryn-${{ needs.check-version.outputs.version }}-${{ github.run_id }}
          name: Bun Penryn ${{ needs.check-version.outputs.version }}
          body: |
            Bun ${{ needs.check-version.outputs.version }} built for Penryn (SSE 4.1)
            SHA256: ${{ steps.sha256.outputs.sha256 }}
          files: /tmp/bun-penryn-linux-x64.tar.gz
          draft: false
          prerelease: false

      - name: Trigger OpenCode build
        if: github.event_name != 'pull_request'
        run: |
          gh api -X POST repos/${{ env.OPENCODE_REPO }}/dispatches \
            -f event_type=bun-built \
            -f client_payload='{"bun_version":"${{ needs.check-version.outputs.version }}","bun_sha256":"${{ steps.sha256.outputs.sha256 }}","bun_url":"${{ steps.release.outputs.url }}/bun-penryn-linux-x64.tar.gz"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger KiloCode build
        if: github.event_name != 'pull_request'
        run: |
          gh api -X POST repos/${{ env.KILOCODE_REPO }}/dispatches \
            -f event_type=bun-built \
            -f client_payload='{"bun_version":"${{ needs.check-version.outputs.version }}","bun_sha256":"${{ steps.sha256.outputs.sha256 }}","bun_url":"${{ steps.release.outputs.url }}/bun-penryn-linux-x64.tar.gz"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: bun-penryn-linux-x64
          path: /tmp/bun-penryn-linux-x64.tar.gz